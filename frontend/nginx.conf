user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # 播放计数是高频、低诊断价值请求，其余 API 仍保留访问日志。
    map $uri $access_loggable {
        ~^/api/videos/[0-9]+/views$ 0;
        default 1;
    }
    access_log /var/log/nginx/access.log main if=$access_loggable;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    client_header_timeout 15s;
    client_body_timeout 600s;
    send_timeout 600s;
    types_hash_max_size 4096;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    upstream videonest_backend {
        server backend:8080;
        keepalive 128;
    }

    upstream videonest_minio {
        server minio:9000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 510m;
        keepalive_timeout 65s;
        keepalive_requests 1000;
        etag on;

        location ^~ /api/ {
            proxy_pass http://videonest_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # 预签名上传虽然不经过这里，但保留流式请求能力以兼容管理接口。
            proxy_request_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MinIO 媒体资源反向代理：不直接暴露 MinIO 端口到公网，通过 nginx 80 端口访问
        # 公开前缀（processed/、cover/processed/）的视频和封面走这里，支持 Range 断点续传
        location ^~ /minio/ {
            proxy_pass http://videonest_minio/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 视频播放支持 Range 断点续传
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            # 媒体资源缓存7天
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        location ~* \.(?:svg|png|jpg|jpeg|webp|ico|woff2?)$ {
            try_files $uri =404;
            directio 4m;
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            access_log off;
        }

        # 防止缺失的脚本、样式和清单文件被 SPA 兜底错误地返回 index.html (200)。
        location ~* \.(?:css|js|mjs|map|json|txt|xml)$ {
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public, max-age=3600" always;
            access_log off;
        }

        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # 带扩展名的缺失资源由上面的静态 location 返回 404；无扩展名路径才做 SPA 兜底。
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
