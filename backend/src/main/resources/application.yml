server:
  port: ${SERVER_PORT:8080}
  # 仅信任容器/内网反向代理转发的客户端地址，供匿名播放限频使用。
  forward-headers-strategy: native
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:20}
    accept-count: ${TOMCAT_ACCEPT_COUNT:300}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:2000}

spring:
  application:
    name: videonest-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:videonest}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:16}
      minimum-idle: ${DB_POOL_MIN_IDLE:8}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: ${FLYWAY_BASELINE_VERSION:3}
    validate-on-migrate: true
    clean-disabled: true

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 510MB

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: ${REDIS_POOL_MIN_IDLE:4}
          max-wait: ${REDIS_POOL_MAX_WAIT:500ms}

  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:2}
      thread-name-prefix: videonest-scheduler-

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2
          max-interval: 5000ms

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  expire-minutes: ${JWT_EXPIRE_MINUTES:120}

auth-rate-limit:
  enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
  login-max-requests: ${LOGIN_MAX_REQUESTS_PER_MINUTE:20}
  login-window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
  register-max-requests: ${REGISTER_MAX_REQUESTS_PER_HOUR:5}
  register-window-seconds: ${REGISTER_RATE_LIMIT_WINDOW_SECONDS:3600}

outbox:
  enabled: ${OUTBOX_ENABLED:true}
  dispatch-interval-milliseconds: ${OUTBOX_DISPATCH_INTERVAL_MILLISECONDS:1000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://127.0.0.1:9000}}
  region: ${MINIO_REGION:us-east-1}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET:videonest}
  public-read-prefixes: ${MINIO_PUBLIC_READ_PREFIXES:processed/,cover/processed/}

video-process:
  ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  ffprobe-path: ${FFPROBE_PATH:ffprobe}
  timeout-seconds: ${VIDEO_PROCESS_TIMEOUT_SECONDS:1800}
  # 单机 Docker 环境默认同时执行两个转码任务，避免多个 FFmpeg 进程耗尽内存。
  # 可设置为 2-4，让 RabbitMQ 在任务积压时最多扩展至四个消费者。
  consumer-concurrency: ${VIDEO_PROCESS_CONSUMER_CONCURRENCY:2}
  cover-backfill-initial-delay-milliseconds: ${COVER_BACKFILL_INITIAL_DELAY_MILLISECONDS:60000}
  cover-backfill-fixed-delay-milliseconds: ${COVER_BACKFILL_FIXED_DELAY_MILLISECONDS:300000}

upload-security:

  antivirus-command: ${ANTIVIRUS_COMMAND:}
  antivirus-required: ${ANTIVIRUS_REQUIRED:false}
  scan-timeout-seconds: ${UPLOAD_SCAN_TIMEOUT_SECONDS:120}
  max-image-pixels: ${MAX_UPLOAD_IMAGE_PIXELS:50000000}

video-view-count:
  flush-delay-milliseconds: ${VIDEO_VIEW_COUNT_FLUSH_DELAY_MILLISECONDS:10000}
  batch-size: ${VIDEO_VIEW_COUNT_BATCH_SIZE:200}
  redis-ttl-seconds: ${VIDEO_VIEW_COUNT_REDIS_TTL_SECONDS:604800}
  dedup-window-seconds: ${VIDEO_VIEW_DEDUP_WINDOW_SECONDS:1800}
  anonymous-limit-per-minute: ${ANONYMOUS_VIEW_LIMIT_PER_MINUTE:30}

hot-rank:
  window-hours: ${HOT_RANK_WINDOW_HOURS:24}
  half-life-hours: ${HOT_RANK_HALF_LIFE_HOURS:6}
  max-size: ${HOT_RANK_MAX_SIZE:50}
  initial-delay-milliseconds: ${HOT_RANK_INITIAL_DELAY_MS:5000}
  refresh-interval-milliseconds: ${HOT_RANK_REFRESH_INTERVAL_MS:45000}
  current-ttl-seconds: ${HOT_RANK_CURRENT_TTL_SECONDS:180}
  cards-ttl-seconds: ${HOT_RANK_CARDS_TTL_SECONDS:60}
  refresh-lock-seconds: ${HOT_RANK_REFRESH_LOCK_SECONDS:40}

video-review:
  timeout-milliseconds: ${VIDEO_REVIEW_TIMEOUT_MILLISECONDS:86400000}

resource-cleanup:
  retention-days: ${RESOURCE_RETENTION_DAYS:7}
  fixed-delay-milliseconds: ${RESOURCE_CLEANUP_FIXED_DELAY_MILLISECONDS:3600000}
  batch-size: ${RESOURCE_CLEANUP_BATCH_SIZE:20}

logging:
  level:
    root: INFO
    com.videonest: ${APP_LOG_LEVEL:INFO}
